name: Motor Daily

on:
  schedule:
    # 06:00 UTC — antes dos crons Vercel (ingest-market 11:00, qi-macro 11:15)
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Disparo remoto sem gh local: commit em main com [motor-daily] na mensagem
  push:
    branches: [main]

concurrency:
  group: motor-daily
  cancel-in-progress: false

jobs:
  motor:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[motor-daily]'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: motor/requirements.txt

      - name: Setup Node (catalog export)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install motor dependencies
        run: pip install -r motor/requirements.txt

      - name: Preflight — secrets obrigatórios
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY ausente nos GitHub Actions secrets. Repo → Settings → Secrets → Actions → New secret."
            exit 1
          fi
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN ausente nos GitHub Actions secrets."
            exit 1
          fi
          echo "Preflight OK (FRED + Blob configurados)."

      - name: Download SQLite from Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python motor/scripts/blob_sync.py download
        continue-on-error: true

      - name: Apply SQLite schema (Fase 2 migrations)
        run: PYTHONPATH=. python -c "from motor.src.db.connection import init_db; init_db(); print('init_db OK')"

      - name: Run motor daily (1A — fontes + macro + top-90% + snapshot)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: PYTHONPATH=. python motor/scripts/run_daily.py

      - name: Validate MVP abas + snapshot
        run: PYTHONPATH=. python motor/scripts/validate_abas.py

      - name: Upload SQLite and dashboard snapshot to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python motor/scripts/blob_sync.py upload

      - name: Upload relatórios to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python motor/scripts/blob_sync.py upload-reports
