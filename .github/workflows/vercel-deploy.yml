name: Vercel Production Deploy

# Manual backup only — production deploys come from Vercel Git integration on push.
# Automatic push trigger removed to avoid duplicate builds (Git + GHA on every commit).

on:
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_g608COD3fSjyIk8ORmL5nQ1c
      VERCEL_PROJECT_ID: prj_AC1kZHFP1EANDFqJ84eZiOv6wAvn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set in GitHub Secrets — skipping deploy."
            echo "Add it at: Settings → Secrets and variables → Actions → VERCEL_TOKEN"
            echo "Or deploy manually: vercel --prod"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.token.outputs.configured == 'true'
        run: npm i -g vercel@latest

      - name: Deploy to production
        if: steps.token.outputs.configured == 'true'
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
